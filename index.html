<!doctype html>
<html lang="pt-BR" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: radial-gradient(ellipse at center, #1a0b2e 0%, #0a0118 50%, #000000 100%);
      color: #e0d5ff;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 100, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(75, 0, 130, 0.2) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent),
        radial-gradient(2px 2px at 90% 60%, white, transparent),
        radial-gradient(1px 1px at 33% 90%, white, transparent),
        radial-gradient(1px 1px at 15% 80%, white, transparent);
      background-size: 200% 200%, 300% 300%, 250% 250%, 280% 280%, 220% 220%, 260% 260%, 290% 290%;
      background-position: 0% 0%, 20% 20%, 40% 40%, 60% 60%, 80% 80%, 10% 90%, 70% 30%;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    
    .game-card {
      background: rgba(20, 10, 40, 0.8);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
      border: 2px solid #4707f892;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }
    
    .game-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 12px 30px rgba(138, 43, 226, 0.5), 0 0 20px rgba(0, 100, 255, 0.3);
      border-color: rgba(138, 43, 226, 0.8);
    }
    
    .game-cover {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #0e1419;
      display: block;
    }
    
    .game-info {
      padding: 15px 88px 10px 90px;
    }
    
    .game-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 8px 0;
    }
    
    .play-button {
      background: linear-gradient(135deg, #6a0dad 0%, #4b0082 100%);
      
      color: #e0d5ff;
      border: 1px solid rgba(138, 43, 226, 0.5);
  
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      
      transition: all 0.3s ease;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }
    
    .play-button:hover {
      background: linear-gradient(135deg, #2200ff 0%, #000000 100%);
      box-shadow: 0 6px 20px rgba(138, 43, 226, 0.6), 0 0 15px rgba(0, 100, 255, 0.4);
      transform: translateY(-2px);
       
    }
    
    .header {
      background: linear-gradient(180deg, rgba(10, 1, 24, 0.95) 0%, rgba(26, 11, 46, 0.8) 100%);
      padding: 20px 32px;
      border-bottom: 2px solid rgba(138, 43, 226, 0.4);
      box-shadow: 0 4px 20px rgba(138, 43, 226, 0.3), 0 0 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }
    
    .library-title {
      font-size: 32px;
      font-weight: 700;
      color: #e0d5ff;
      margin: 0 0 6px 0;
      text-shadow: 0 0 20px rgba(138, 43, 226, 0.8), 0 0 40px rgba(0, 100, 255, 0.4);
      letter-spacing: 2px;
    }
    
    .welcome-text {
      font-size: 14px;
      color: #b8a9d8;
      margin: 0;
      text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
    }
    
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 40px 32px;
      position: relative;
      z-index: 1;
    }
    
    @media (max-width: 768px) {
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        padding: 16px;
      }
      
      .header {
        padding: 12px 16px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

 <body class="h-full">
  <div class="h-full w-full overflow-auto">
   <header class="header flex items-center gap-4">
    <img src="capas/Aivora.png" alt="Logo Aivora" class="h-32 w-32 object-contain">
    <div>
     <h1 class="library-title" id="libraryTitle"></h1>
     <p class="welcome-text" id="welcomeText">Jogos criados com IA. Jogue direto no navegador.</p>
    </div>
   </header>
   <main class="games-grid" id="gamesGrid"><!-- Games will be rendered here -->
   </main>

  <script>
    // Game data - Add more games here
    const games = [
      {
        id: 1,
        title: 'Kingdom Of Monsters',
        coverImage: 'capas/Kingdom-Of-Monsters.png',
        url: 'https://denis-zero.github.io/-Kingdom-Of-Monsters/'
      },

     {
        id: 2,
        title: 'Echo of the Void Survivals',
        coverImage: 'capas/Echo-of-the-Void-Survival.png',
        url: 'https://denis-zero.github.io/Echo-of-the-Void-Survival//'
      }
      // Add more games following this format:
      // {
      //   id: 2,
      //   title: 'Game Name',
      //   coverImage: 'capas/game-name.jpg',
      //   url: 'https://game-url.com'
      // }
    ];

    // Default configuration
    const defaultConfig = {
      library_title: '',
      welcome_text: 'Jogos criados com IA. Jogue direto no navegador.',
      background_color: '#1a0b2e',
      card_color: 'rgba(20, 10, 40, 0.8)',
      accent_color: '#8a2be2',
      button_color: '#6a0dad',
      text_color: '#e0d5ff',
      font_family: 'Arial',
      font_size: 26
    };

    // Render games function
    function renderGames() {
      const gamesGrid = document.getElementById('gamesGrid');
      gamesGrid.innerHTML = '';
      
      games.forEach(game => {
        const gameCard = document.createElement('div');
        gameCard.className = 'game-card';
        
        gameCard.innerHTML = `
          <img src="${game.coverImage}" alt="${game.title}" class="game-cover" 
               onerror="this.src=''; this.alt='Imagem n�0�0o encontrada'; this.style.background='#0e1419'; this.style.display='flex'; this.style.alignItems='center'; this.style.justifyContent='center';">
          <div class="game-info">
            <h3 class="game-title">${game.title}</h3>
            <button class="play-button" onclick="playGame('${game.url}')">JOGAR</button>
          </div>
        `;
        
        gamesGrid.appendChild(gameCard);
      });
    }

    // Play game function
    function playGame(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // Element SDK configuration
    async function onConfigChange(config) {
      const customFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = 'Arial, sans-serif';
      const baseSize = config.font_size || defaultConfig.font_size;
      
      // Update text content
      document.getElementById('libraryTitle').textContent = config.library_title || defaultConfig.library_title;
      document.getElementById('welcomeText').textContent = config.welcome_text || defaultConfig.welcome_text;
      
      // Update colors
      document.body.style.background = `radial-gradient(ellipse at center, ${config.background_color || defaultConfig.background_color} 0%, #0a0118 50%, #000000 100%)`;
      document.body.style.color = config.text_color || defaultConfig.text_color;
      
      // Update font
      document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      // Update font sizes
      document.querySelector('.library-title').style.fontSize = `${baseSize * 1.75}px`;
      document.querySelector('.welcome-text').style.fontSize = `${baseSize * 0.875}px`;
      
      const gameTitles = document.querySelectorAll('.game-title');
      gameTitles.forEach(title => {
        title.style.fontSize = `${baseSize}px`;
        title.style.fontFamily = `${customFont}, ${baseFontStack}`;
      });
      
      const playButtons = document.querySelectorAll('.play-button');
      playButtons.forEach(button => {
        button.style.fontSize = `${baseSize * 0.875}px`;
        button.style.fontFamily = `${customFont}, ${baseFontStack}`;
        button.style.background = config.button_color || defaultConfig.button_color;
      });
      
      // Update card colors
      const gameCards = document.querySelectorAll('.game-card');
      gameCards.forEach(card => {
        card.style.background = config.card_color || defaultConfig.card_color;
      });
    }

    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig: defaultConfig,
        onConfigChange: onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.card_color || defaultConfig.card_color,
              set: (value) => {
                config.card_color = value;
                window.elementSdk.setConfig({ card_color: value });
              }
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => {
                config.accent_color = value;
                window.elementSdk.setConfig({ accent_color: value });
              }
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({ button_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ['library_title', config.library_title || defaultConfig.library_title],
          ['welcome_text', config.welcome_text || defaultConfig.welcome_text]
        ])
      });
    }

    // Initial render
    renderGames();
  </script>
